[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = true

[rpc_endpoints]
arc = "${ARC_RPC_URL}"
arc_testnet = "${ARC_TESTNET_RPC_URL}"

[lint]
# Schedule checks are minutes to days wide; second-level timestamp drift doesn't matter here.
exclude_lints = ["block-timestamp"]
ignore = ["test/*.sol", "test/**/*.sol"]
